name: CI

# Quality gate for every push (any branch) and every pull request to main:
# typecheck, lint, test, and build across all packages.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Both supported Node lines (engines: >=24): 24 is Active LTS, 26 is current. setup-node
      # resolves each to the latest release of that line.
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        # Pinned to a full commit SHA (same policy as release.yml) so a moved tag can't swap code.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
